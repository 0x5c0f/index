<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>0x5c0f - 个人主页</title>

<body>
  <!-- 加载动画 -->
  <div id="loader-wrapper">
    <div class="loader">
      <div class="loader-circle"></div>
      <div class="loader-text">
        <span class="site-name">0x5c0f</span>

  <div class="particles" id="particles"></div>

  <!-- 主页面 -->
  <div id="main">

      <!-- 头部 -->
      <div class="header">
        <div class="avatar">
          <img src="img/logo_avatar.png" alt="0x5c0f 的头像" loading="lazy">

        <div class="time" id="time">00:00</div>

      <!-- 一言 -->
      <div class="quote-section">
        <p class="quote" id="quote">「加载中...」</p>
      </div>

      <!-- 链接 -->
      <div class="links-section">
        <a href="mailto:mail@0x5c0f.cc" class="link-item" title="发送邮件">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>

        </a>
        <a href="https://blog.0x5c0f.cc" class="link-item" target="_blank" rel="noopener noreferrer" title="访问博客">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>博客</span>
        </a>
        <a href="https://github.com/0x5c0f" class="link-item" target="_blank" rel="noopener noreferrer" title="GitHub 主页">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        </a>

      </div>
