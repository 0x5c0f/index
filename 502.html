<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>502 · 一个曾经的小码农</title>
<meta name="theme-color" content="#08080c">
<style>
  :root{
    --bg:#08080c;
    --bg-panel:#0d0e15;
    --border:#212333;
    --fg:#e2e3ec;
    --fg-dim:#7b7e91;
    --fg-dimmer:#3c3f54;
    --ink:#c9a877;
    --ink-soft:rgba(201,168,119,0.35);
    --ink-glow:rgba(201,168,119,0.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace;
    font-size:18px;
    line-height:1.65;
    padding:40px 24px;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:800px;
  }
  .glow{
    position:absolute;
    left:50%;
    top:38%;
    width:120%;
    aspect-ratio:1.6/1;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, var(--ink-glow), transparent 72%);
    filter:blur(6px);
    z-index:0;
    pointer-events:none;
  }
  .term{
    position:relative;
    z-index:1;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.03) inset,
      0 60px 120px -40px rgba(0,0,0,0.85),
      0 20px 50px -15px var(--ink-soft);
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:9px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    background:#0a0b11;
  }
  .dot{width:11px;height:11px;border-radius:50%;background:var(--fg-dimmer);}
  .term-title{
    margin-left:10px;
    color:var(--fg-dim);
    font-size:13px;
    letter-spacing:.02em;
  }
  .term-body{
    padding:42px 46px 48px;
  }
  .line{white-space:pre-wrap;word-break:break-word;font-size:17px;}
  .prompt{color:var(--ink);}
  .path{color:#9a9cb0;}
  .out-err{color:#c99b9b;}
  .out-dim{color:var(--fg-dim);}
  .cursor{
    display:inline-block;
    width:8px;height:16px;
    background:var(--ink);
    vertical-align:-3px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .divider{
    height:1px;
    background:var(--border);
    margin:26px 0 28px;
  }

  .code{
    font-size:clamp(72px, 12vw, 116px);
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--fg);
    line-height:1;
    margin:0 0 20px;
  }
  .code .accent{color:var(--ink);}
  .headline{
    color:var(--fg);
    font-size:23px;
    margin:0 0 11px;
    font-weight:500;
  }
  .sub{
    color:var(--fg-dim);
    font-size:16.5px;
    margin:0;
    line-height:1.7;
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:14px 28px;
    margin-top:34px;
  }
  .actions a, .actions button{
    color:var(--fg);
    text-decoration:none;
    font-family:inherit;
    font-size:16px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .actions .cmd{color:var(--ink);}
  .actions .arrow{color:var(--fg-dimmer);}
  .actions a:hover .cmd, .actions button:hover .cmd{
    text-decoration:underline;
  }

  .footline{
    margin-top:28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--fg-dimmer);
    font-size:12.5px;
  }
  #clock{color:var(--fg-dim);}
  .blur{
    filter:blur(2.5px);
    opacity:.55;
    letter-spacing:.01em;
    user-select:none;
  }

  @media (max-width:560px){
    .term-body{padding:28px 24px 32px;}
    .code{font-size:clamp(52px,18vw,72px);}
    .headline{font-size:19px;}
  }
  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;opacity:1;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow" aria-hidden="true"></div>

  <div class="term">
    <div class="term-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="term-title">bash — <span class="blur" id="hostTitle">tools.0x5c0f.cc</span></span>
    </div>
    <div class="term-body">
      <div class="line"><span class="prompt">$</span> curl -I https://<span class="path blur" id="hostCurl">tools.0x5c0f.cc</span></div>
      <div class="line out-err">curl: (52) 服务器没有返回任何数据</div>
      <div class="line out-dim">exit code <span id="exitCode">502</span><span class="cursor"></span></div>

      <div class="divider"></div>

      <p class="code">5<span class="accent">0</span>2</p>
      <p class="headline">那头，暂时没回应。</p>
      <p class="sub">多半是重启了一下，等等它就回来。</p>

      <div class="actions">
        <button onclick="location.reload()"><span class="cmd">$ retry</span><span class="arrow">→ 再试一次</span></button>
        <a href="/"><span class="cmd">$ cd ~</span><span class="arrow">→ 回到主页</span></a>
        <a href="https://blog.0x5c0f.cc"><span class="cmd">$ openblog</span><span class="arrow">→ blog.0x5c0f.cc</span></a>
      </div>

      <div class="footline">
        <span>by 0x5c0f</span>
        <span>已经等了 <span id="elapsed">00:00</span> · <span id="clock">00:00:00</span></span>
      </div>
    </div>
  </div>
</div>

<script>
  function tick(){
    var d = new Date();
    var f = function(n){ return String(n).padStart(2,'0'); };
    document.getElementById('clock').textContent = f(d.getHours())+':'+f(d.getMinutes())+':'+f(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);

  try {
    var host = window.location.hostname || 'tools.0x5c0f.cc';
    document.getElementById('hostTitle').textContent = host;
    document.getElementById('hostCurl').textContent = host;
  } catch(e){}

  var start = Date.now();
  function elapsedTick(){
    var s = Math.floor((Date.now()-start)/1000);
    var m = Math.floor(s/60);
    var f = function(n){ return String(n).padStart(2,'0'); };
    document.getElementById('elapsed').textContent = f(m) + ':' + f(s%60);
  }
  elapsedTick();
  setInterval(elapsedTick, 1000);

  // 静默地在后台检查是否已经恢复，不用焦虑地盯着倒计时
  setInterval(function(){
    fetch('/', {method:'HEAD', cache:'no-store'}).then(function(r){
      if(r.ok) location.reload();
    }).catch(function(){});
  }, 20000);
</script>
</body>
</html>
