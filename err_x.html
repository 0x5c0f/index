<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维护中</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #3498db, #8e44ad);
        }
        .container {
            width: 50%;
            height: 50vh;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            height: 51px; /* 固定高度 */
        }
        
        .system-name {
            display: flex;
            align-items: center;
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #77B2E3, #639BC6);
            background-clip: text;
            -webkit-background-clip: text;
            -moz-background-clip: text;
            -o-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        .system-name img {
            margin-right: 10px;
            width: 40px;
        }
        .menu {
            display: flex;
            align-items: center;
        }
        .menu a {
            margin-left: 10px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        .menu span {
            margin: 0 5px;
            color: #3498db;
        }
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin-top: 10px;
        }
        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin: 0;
        }
        p {
            color: #555;
            font-size: 1.3em;
            line-height: 1.6;
            margin: 10px 0;
        }
        .progress-container {
            width: 100%; /* 保持容器宽度为100% */
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 20px;
            height: 10px; /* 调整进度条容器的高度 */
            max-width: 60%; /* 设置最大宽度 */
            margin-left: auto; /* 居中 */
            margin-right: auto; /* 居中 */
        }
        .progress-bar {
            height: 100%; /* 保持进度条高度为容器的100% */
            width: 0; /* 初始宽度为0 */
            background: #3498db;
            border-radius: 5px;
            transition: width 1s linear; /* 动画效果 */
        }
        @media (max-width: 767px) {
            .container {
                width: 90%;
                padding: 20px;
                height: auto; /* 自适应高度 */
            }
            .header {
                flex-direction: column;
                align-items: center;
                height: auto; /* 自适应高度 */
            }
            .menu {
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 10px;
            }
            .menu a {
                margin: 5px;
            }
            .system-name {
                font-size: 1.2em;
                margin-bottom: 10px;
            }
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="system-name" id="system-name">
                <!-- Logo will be inserted here if available -->
                一个曾经的小码农...
            </div>
            <div class="menu">
                <a href="/">首页</a>
                <span>|</span>
                <a href="mailto:admin@example.com">联系管理员</a>
            </div>
        </div>
        <div class="content">
            <h1>系统维护中 ...</h1>
            <p>我们正在进行一些必要的维护。请稍后再试。</p>
            <p>感谢您的耐心等待。</p>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <script>
        const logoBase64 = ""; // Add your base64 string here
        if (logoBase64) {
            const img = document.createElement('img');
            img.src = `data:image/png;base64,${logoBase64}`;
            img.alt = 'Logo';
            img.style.width = '40px';
            document.getElementById('system-name').prepend(img);
        }

        // 定时跳转功能
        const totalDuration = 180000; // 3分钟
        const progressBar = document.getElementById('progress-bar');

        // 更新进度条
        let startTime = Date.now();
        const updateProgress = () => {
            const elapsedTime = Date.now() - startTime;
            const progressPercentage = Math.min((elapsedTime / totalDuration) * 100, 100);
            progressBar.style.width = progressPercentage + '%';

            if (elapsedTime < totalDuration) {
                requestAnimationFrame(updateProgress);
            } else {
                window.location.href = '/'; // 跳转到首页
            }
        };

        requestAnimationFrame(updateProgress);
    </script>
</body>
</html>
